<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In | PrettyPick</title>
<link rel="stylesheet" href="styles.css">
<script src="shared.js"></script>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="logo.png" alt="PrettyPick Logo" class="auth-logo" onerror="this.style.display='none'">
      <h2>Welcome Back</h2>
      <p>Sign in to your PrettyPick account</p>
    </div>

    <form id="login-form" novalidate>
      <div id="error-msg" class="error-msg hidden" role="alert"></div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" required placeholder="Enter your email address" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-control" required placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Show</button>
        </div>
      </div>
      <div class="auth-links"><a href="forgot-password.html">Forgot Password?</a></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span class="btn-text">Sign In</span>
        <span class="spinner hidden"></span>
      </button>
    </form>

    <div class="auth-divider">OR</div>
    <button type="button" class="btn-google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.8 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.5 29.3 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.3-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 7 29.3 5 24 5 16.3 5 9.7 9 6.3 14.7z"/><path fill="#4CAF50" d="M24 43.5c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 34.6 26.7 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2c-.4.4 6.6-4.8 6.6-14.8 0-1.2-.1-2.3-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-footer">
      <p>Don't have an account? <a href="signup.html">Create Account</a></p>
    </div>
  </div>
</div>

<script type="module">
import { auth } from './firebase-config.js';
import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const form = document.getElementById('login-form');
const btn = document.getElementById('submit-btn');
const btnText = btn.querySelector('.btn-text');
const spinner = btn.querySelector('.spinner');
const errMsg = document.getElementById('error-msg');
const emailInput = document.getElementById('email');
const passInput = document.getElementById('password');

// Determine redirect destination after successful login
function getRedirectDestination() {
  // Priority 1: explicit redirect from sessionStorage (set by checkout)
  const storedRedirect = sessionStorage.getItem('pp_redirect');
  if (storedRedirect) {
    sessionStorage.removeItem('pp_redirect');
    return storedRedirect;
  }
  // Priority 2: query string ?redirect=...
  const params = new URLSearchParams(location.search);
  const qRedirect = params.get('redirect');
  if (qRedirect) {
    // Only allow internal relative paths
    if (qRedirect.startsWith('/') || /^[a-zA-Z0-9_\-./]+\.html/.test(qRedirect)) {
      return qRedirect;
    }
  }
  // Default: account page
  return 'account.html';
}

const showErr = (m) => {
  errMsg.textContent = m;
  errMsg.classList.remove('hidden');
  showToast(m, 'error');
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errMsg.classList.add('hidden');
  const email = emailInput.value.trim();
  const password = passInput.value;
  if (!email || !password) { showErr('Please enter email and password.'); return; }

  btn.disabled = true;
  btnText.textContent = 'Signing In...';
  spinner.classList.remove('hidden');

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showToast('Signed in successfully', 'success');
    const dest = getRedirectDestination();
    setTimeout(() => { window.location.href = dest; }, 400);
  } catch (error) {
    let msg = "Invalid email or password.";
    if (error.code === 'auth/too-many-requests') msg = "Too many failed attempts. Please try again later.";
    else if (error.code === 'auth/network-request-failed') msg = "Network error. Please check your connection.";
    showErr(msg);
    btn.disabled = false;
    btnText.textContent = 'Sign In';
    spinner.classList.add('hidden');
  }
});

document.getElementById('google-btn').onclick = async () => {
  errMsg.classList.add('hidden');
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
    showToast('Signed in successfully', 'success');
    const dest = getRedirectDestination();
    setTimeout(() => { window.location.href = dest; }, 400);
  } catch (error) {
    if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
      showErr('Google sign-in failed. Please try again.');
    }
  }
};

window.togglePassword = (id, b) => {
  const input = document.getElementById(id);
  if (input.type === 'password') { input.type = 'text'; b.textContent = 'Hide'; }
  else { input.type = 'password'; b.textContent = 'Show'; }
};
</script>
</body>
</html>

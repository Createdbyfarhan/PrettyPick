<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password | PrettyPick</title>
<link rel="stylesheet" href="styles.css">
<script src="shared.js"></script>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="logo.png" alt="PrettyPick" class="auth-logo" onerror="this.style.display='none'">
      <h2>Reset Password</h2>
      <p>We'll email you a secure reset link</p>
    </div>
    <form id="reset-form" novalidate>
      <div id="error-msg" class="error-msg hidden" role="alert"></div>
      <div id="success-msg" class="success-msg hidden" role="status"></div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" required placeholder="Enter your email address" autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
        <span class="btn-text">Send Reset Link</span>
        <span class="spinner hidden"></span>
      </button>
    </form>
    <div class="auth-footer"><p>Remember your password? <a href="login.html">Back to Sign In</a></p></div>
  </div>
</div>
<script type="module">
import { auth } from './firebase-config.js';
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const form = document.getElementById('reset-form');
const btn = document.getElementById('submit-btn');
const btnText = btn.querySelector('.btn-text');
const spinner = btn.querySelector('.spinner');
const errMsg = document.getElementById('error-msg');
const successMsg = document.getElementById('success-msg');

const isValidEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errMsg.classList.add('hidden');
  successMsg.classList.add('hidden');

  const email = document.getElementById('email').value.trim();
  if (!isValidEmail(email)) {
    errMsg.textContent = 'Please enter a valid email address.';
    errMsg.classList.remove('hidden');
    showToast('Please enter a valid email address', 'warning');
    return;
  }

  btn.disabled = true;
  btnText.textContent = 'Sending…';
  spinner.classList.remove('hidden');

  try {
    await sendPasswordResetEmail(auth, email);
  } catch (err) {
    if (err.code === 'auth/too-many-requests') {
      errMsg.textContent = 'Too many requests. Please try again later.';
      errMsg.classList.remove('hidden');
      showToast('Too many requests. Try again later', 'warning');
      btn.disabled = false;
      btnText.textContent = 'Send Reset Link';
      spinner.classList.add('hidden');
      return;
    }
  }

  successMsg.textContent = 'If an account exists for this email, password reset instructions will be sent.';
  successMsg.classList.remove('hidden');
  showToast('Reset link sent if account exists', 'success');
  document.getElementById('email').value = '';
  btn.disabled = false;
  btnText.textContent = 'Send Reset Link';
  spinner.classList.add('hidden');
});
</script>
</body>
</html>

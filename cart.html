<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your Cart | PrettyPick</title>
<link rel="stylesheet" href="styles.css">
<script src="shared.js"></script>
</head>
<body>
<header class="navbar">
  <div class="nav-container">
    <div class="nav-left"><a href="index.html"><img src="logo.png" alt="PrettyPick" id="brand-logo"></a></div>
    <div class="nav-right">
      <a href="wishlist.html" class="icon-btn badge-container" aria-label="Wishlist">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="badge badge-wishlist">0</span>
      </a>
      <a href="cart.html" class="icon-btn badge-container" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="badge badge-cart">0</span>
      </a>
      <a href="account.html" class="icon-btn" aria-label="Account">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="section-container">
  <h1 style="margin-bottom:26px;">Shopping Cart</h1>
  <div id="cart-content"><p style="text-align:center;color:var(--text-muted);">Loading cart…</p></div>
</main>

<script type="module">
import { db } from './firebase-config.js';
import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

async function init() {
  try {
    const snap = await getDocs(query(collection(db, 'products'), where('active', '==', true)));
    window.__PP_CACHE.products = snap.docs.map(normalizeProduct);
    window.__PP_CACHE.ready = true;
  } catch (e) { console.error('Cart load error', e); }
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cart-content');
  const cart = getCart();

  if (!cart.length) {
    container.innerHTML = `
      <div style="text-align:center;padding:50px 20px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);">
        <h2 style="margin-bottom:14px;">Your cart is empty</h2>
        <p style="color:var(--text-muted);margin-bottom:22px;">Looks like you haven't added anything yet.</p>
        <a href="index.html" class="btn btn-primary">Continue Shopping</a>
      </div>`;
    return;
  }

  let subtotal = 0;
  const rows = [];
  cart.forEach(item => {
    const p = getProductById(item.id);
    if (!p) return;
    const qty = Math.min(item.qty, p.stock);
    subtotal += p.price * qty;
    rows.push(`
      <div style="display:flex;flex-wrap:wrap;align-items:center;padding:16px;border-bottom:1px solid var(--border);gap:14px;">
        <div style="flex:1 1 200px;min-width:0;display:flex;gap:12px;align-items:center;">
          <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" style="width:72px;height:72px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;" onerror="this.style.display='none';">
          <div style="min-width:0;">
            <a href="product.html?id=${encodeURIComponent(p.id)}" style="font-weight:600;font-size:15px;word-break:break-word;">${escapeHtml(p.name)}</a>
            <p style="color:var(--gold);font-weight:600;">${formatPrice(p.price)}</p>
            ${p.freeShipping ? `<span class="free-shipping-badge">✓ Free Shipping</span>` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;justify-content:center;flex-shrink:0;">
          <button class="btn btn-outline" style="padding:4px 10px;" onclick="updateQty('${escapeHtml(p.id)}',-1)">−</button>
          <span style="font-weight:600;min-width:20px;text-align:center;">${qty}</span>
          <button class="btn btn-outline" style="padding:4px 10px;" onclick="updateQty('${escapeHtml(p.id)}',1)" ${qty >= p.stock ? 'disabled' : ''}>+</button>
        </div>
        <div style="text-align:right;font-weight:600;flex-shrink:0;">
          ${formatPrice(p.price * qty)}
          <br><button style="font-size:12px;color:red;margin-top:6px;text-decoration:underline;" onclick="removeItem('${escapeHtml(p.id)}')">Remove</button>
        </div>
      </div>`);
  });

  if (!rows.length) {
    saveCart([]);
    container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px;">Cart items are no longer available.</p>';
    return;
  }

  container.innerHTML = `
    <div style="background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;">${rows.join('')}</div>
    <div style="margin-top:20px;text-align:right;">
      <h2 style="margin-bottom:12px;">Subtotal: <span style="color:var(--gold);">${formatPrice(subtotal)}</span></h2>
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:18px;">Coupon and shipping calculated at checkout.</p>
      <a href="checkout.html" class="btn btn-primary" style="width:100%;max-width:320px;padding:14px;display:inline-block;">Proceed to Checkout</a>
    </div>`;
}

window.updateQty = (id, change) => {
  let cart = getCart();
  const item = cart.find(i => i.id === id);
  if (!item) return;
  const p = getProductById(id);
  const max = p ? p.stock : 999;
  item.qty += change;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== id);
    showToast('Removed from cart', 'info');
  } else if (item.qty > max) {
      item.qty = max;
    showToast('Stock limit reached', 'warning');
  }
  saveCart(cart);
  renderCart();
};
window.removeItem = (id) => {
  saveCart(getCart().filter(i => i.id !== id));
  showToast('Item removed', 'info');
  renderCart();
};
init();
</script>
</body>
</html>
